<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthAI - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dff6ff, #e8f5e9);
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #168aad;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .welcome {
            text-align: center;
            font-size: 25px;
            color: #222;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #168aad;
            box-shadow: 0 0 5px rgba(22, 138, 173, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #168aad;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #126782;
            transform: translateY(-2px);
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #168aad;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .register-text a {
            color: #168aad;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 12px;
            background: #f1f9fb;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }

        .health-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        @media (max-width: 500px) {

            .login-container {
                width: 90%;
                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>

    <div class="login-container">

        <!-- HEALTH ICON -->
        <div class="health-icon">
            ❤️
        </div>


        <!-- LOGO -->
        <div class="logo">
            HealthAI
        </div>


        <div class="subtitle">
            AI Based Preventive Health Care
        </div>


        <!-- WELCOME -->
        <h2 class="welcome">
            Welcome Back!
        </h2>


        <p class="description">
            Login to continue your personalized health journey.
        </p>


        <!-- LOGIN FORM -->
        <form action="/login" method="POST">


            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- FORGOT PASSWORD -->
            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-btn">

                Login to HealthAI

            </button>

        </form>


        <!-- REGISTER -->
        <div class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <!-- SECURITY MESSAGE -->
        <div class="security">

            🔒 Your health information is handled securely.

        </div>

    </div>


</body>

</html>
